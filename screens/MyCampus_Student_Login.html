<style>

      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-[#eef2f6] min-h-screen flex items-center justify-center p-0 sm:p-4 text-on-surface antialiased font-body-md">
<!-- Mobile Viewport Shell (Flutter App Device Canvas: ~390px-410px width) -->
<main class="w-full sm:max-w-[400px] min-h-screen sm:min-h-[852px] bg-background sm:rounded-[44px] shadow-2xl overflow-hidden relative flex flex-col justify-between border-0 sm:border sm:border-outline-variant/30">
<!-- Decorative Soft Lighting / Glow Gradients -->
<div class="absolute -top-24 -right-20 w-64 h-64 bg-primary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-72 -left-20 w-56 h-56 bg-secondary-fixed/30 rounded-full blur-3xl pointer-events-none"></div>
<!-- Top Canvas Section: Status Bar & Identity -->
<div class="relative z-10 w-full flex flex-col">
<!-- iOS / Flutter Device Status Bar -->
<div class="w-full pt-3 px-6 pb-2 flex justify-between items-center text-on-surface select-none">
<span class="text-label-md font-label-md font-semibold tracking-tight">9:41</span>
<div class="flex items-center gap-1.5 text-on-surface">
<span class="material-symbols-outlined text-[17px]" data-icon="signal_cellular_4_bar">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[17px]" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[20px]" data-icon="battery_full">battery_full</span>
</div>
</div>
<!-- Campus / App Identity -->
<div class="px-margin pt-4 pb-2 flex flex-col items-center text-center">
<!-- Logo Squircle -->
<div class="relative w-16 h-16 rounded-[22px] bg-white border border-outline-variant/40 flex items-center justify-center ambient-card-shadow mb-3 transition-transform duration-300 active:scale-95 group">
<div class="absolute inset-1 rounded-[18px] bg-gradient-to-tr from-sky-50 to-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="account_balance">account_balance</span>
</div>
<!-- Tiny status badge dot -->
<span class="absolute top-1 right-1 w-2.5 h-2.5 rounded-full bg-primary-container border-2 border-white"></span>
</div>
<!-- Wordmark with Sky Blue Dot Accent -->
<div class="flex items-center justify-center mb-1">
<h1 class="text-headline-lg font-headline-lg text-[#0F172A] tracking-tight">
            MyCampus<span class="text-primary-container font-black">.</span>
</h1>
</div>
<!-- Welcome Headlines -->
<p class="text-headline-md font-headline-md text-on-surface mb-1 font-semibold">Welcome Back</p>
<p class="text-body-sm font-body-sm text-outline max-w-[280px]">
          Sign in to access your student portal, courses &amp; campus services
        </p>
</div>
</div>
<!-- Middle Interactive Section: Campus Authentication Form Card -->
<div class="relative z-10 px-margin flex-1 flex flex-col justify-center py-2">
<div class="bg-surface-container-lowest rounded-3xl p-5 border border-outline-variant/50 ambient-card-shadow">
<!-- Segmented Role Switcher: Student vs Faculty -->
<div class="w-full bg-[#f1f5f9] p-1 rounded-2xl flex items-center mb-5 relative" role="tablist">
<button class="w-1/2 py-2 text-center rounded-xl bg-white text-on-surface text-label-md font-label-md shadow-sm transition-all duration-200 flex items-center justify-center gap-1.5" id="tab-student" onclick="selectRole('student')" type="button">
<span class="material-symbols-outlined text-[16px] text-primary" data-icon="school">school</span>
<span>Student</span>
</button>
<button class="w-1/2 py-2 text-center rounded-xl text-outline text-label-md font-label-md hover:text-on-surface transition-all duration-200 flex items-center justify-center gap-1.5" id="tab-faculty" onclick="selectRole('faculty')" type="button">
<span class="material-symbols-outlined text-[16px]" data-icon="badge">badge</span>
<span>Faculty &amp; Staff</span>
</button>
</div>
<form class="space-y-3.5" onsubmit="event.preventDefault();">
<!-- Student ID / Email Field -->
<div class="space-y-1 text-left">
<label class="block text-label-sm font-label-sm text-[#0F172A] uppercase tracking-wider pl-1" id="identity-label">
              Student ID or Campus Email
            </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none" data-icon="alternate_email">alternate_email</span>
<input class="w-full h-12 pl-11 pr-4 bg-white rounded-2xl border border-outline-variant/60 text-body-md font-body-md text-on-surface placeholder:text-outline/60 focus:border-primary-container focus:ring-4 focus:ring-primary-container/15 outline-none transition-all duration-200" id="identity-input" placeholder="e.g. alex.rivers@campus.edu" type="text"/>
</div>
</div>
<!-- Password Field with Visibility Toggle -->
<div class="space-y-1 text-left">
<label class="block text-label-sm font-label-sm text-[#0F172A] uppercase tracking-wider pl-1">
              Password
            </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none" data-icon="lock">lock</span>
<input class="w-full h-12 pl-11 pr-11 bg-white rounded-2xl border border-outline-variant/60 text-body-md font-body-md text-on-surface placeholder:text-outline/60 focus:border-primary-container focus:ring-4 focus:ring-primary-container/15 outline-none transition-all duration-200" id="password-input" placeholder="Enter your campus password" type="password"/>
<button aria-label="Toggle password view" class="absolute right-3.5 text-outline hover:text-on-surface focus:outline-none transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="password-eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Helper Row: Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-1 pb-1 px-1">
<label class="flex items-center gap-2 cursor-pointer group">
<input checked="" class="w-4 h-4 rounded-md border-outline-variant text-[#0284C7] focus:ring-primary-container/40 focus:ring-offset-0 cursor-pointer" type="checkbox"/>
<span class="text-body-sm font-body-sm text-outline group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
<a class="text-body-sm font-body-sm font-semibold text-[#0284C7] hover:underline hover:text-primary transition-colors" href="#">
              Forgot Password?
            </a>
</div>
<!-- Primary Submit Button -->
<button class="w-full h-12 rounded-xl bg-primary-container hover:bg-[#0284C7] active:scale-[0.98] text-white font-headline-sm text-headline-sm ambient-button-shadow transition-all duration-200 flex items-center justify-center gap-2 mt-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider with Subtle Lines -->
<div class="relative flex items-center justify-center my-4">
<div class="w-full border-t border-outline-variant/40"></div>
<span class="absolute px-3 bg-surface-container-lowest text-label-sm font-label-sm text-outline">
            Or sign in with
          </span>
</div>
<!-- Biometric / SSO Quick Access Grid -->
<div class="grid grid-cols-2 gap-2.5">
<!-- Face ID / Touch ID Button -->
<button class="h-11 px-3 rounded-2xl border border-outline-variant/50 bg-white hover:bg-surface-container active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2 text-on-surface" type="button">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="fingerprint">fingerprint</span>
<span class="text-label-md font-label-md">Biometrics</span>
</button>
<!-- University SSO Button -->
<button class="h-11 px-3 rounded-2xl border border-outline-variant/50 bg-white hover:bg-surface-container active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2 text-on-surface" type="button">
<span class="material-symbols-outlined text-[#0284C7] text-[20px]" data-icon="verified_user">verified_user</span>
<span class="text-label-md font-label-md">Campus SSO</span>
</button>
</div>
</div>
</div>
<!-- Bottom Footer Section: Actions & Home Bar Indicator -->
<div class="relative z-10 w-full px-margin pb-3 pt-1 flex flex-col items-center text-center space-y-2">
<!-- Activation / Registration prompt -->
<p class="text-body-sm font-body-sm text-outline">
        New Student? 
        <a class="font-semibold text-[#0284C7] hover:underline ml-0.5" href="#">Activate Account</a>
</p>
<!-- IT Support Micro Link -->
<a class="inline-flex items-center gap-1 text-[11px] text-outline hover:text-on-surface transition-colors py-0.5" href="#">
<span class="material-symbols-outlined text-[14px]" data-icon="support_agent">support_agent</span>
<span>Need help? Contact Campus IT Support</span>
</a>
<!-- Flutter / Mobile Standard Home Indicator Bar -->
<div class="w-full flex justify-center pt-2 pb-1">
<div class="w-32 h-1 bg-[#CBD5E1] rounded-full"></div>
</div>
</div>
</main>
<!-- Interactive Micro-Scripts (Role Switcher & Password Visibility) -->
<script>
    function selectRole(role) {
      const studentBtn = document.getElementById('tab-student');
      const facultyBtn = document.getElementById('tab-faculty');
      const label = document.getElementById('identity-label');
      const input = document.getElementById('identity-input');

      if (role === 'student') {
        studentBtn.className = "w-1/2 py-2 text-center rounded-xl bg-white text-on-surface text-label-md font-label-md shadow-sm transition-all duration-200 flex items-center justify-center gap-1.5";
        facultyBtn.className = "w-1/2 py-2 text-center rounded-xl text-outline text-label-md font-label-md hover:text-on-surface transition-all duration-200 flex items-center justify-center gap-1.5";
        label.innerText = "Student ID or Campus Email";
        input.placeholder = "e.g. alex.rivers@campus.edu or #CS-9428";
      } else {
        facultyBtn.className = "w-1/2 py-2 text-center rounded-xl bg-white text-on-surface text-label-md font-label-md shadow-sm transition-all duration-200 flex items-center justify-center gap-1.5";
        studentBtn.className = "w-1/2 py-2 text-center rounded-xl text-outline text-label-md font-label-md hover:text-on-surface transition-all duration-200 flex items-center justify-center gap-1.5";
        label.innerText = "Faculty ID or Academic Email";
        input.placeholder = "e.g. prof.watson@university.edu";
      }
    }

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password-input');
      const icon = document.getElementById('password-eye-icon');
      
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.innerText = 'visibility_off';
      } else {
        pwdInput.type = 'password';
        icon.innerText = 'visibility';
      }
    }
  </script>
</body></html>
