<style>
    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.94; }
    }
    @keyframes progress-slide {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(20%); }
      100% { transform: translateX(250%); }
    }
    @keyframes aura-rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .animate-aura {
      animation: aura-rotate 18s linear infinite;
    }
    .animate-logo-pulse {
      animation: pulse-subtle 4s ease-in-out infinite;
    }
    .animate-progress {
      animation: progress-slide 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center p-0 md:p-6 overflow-hidden select-none">
<!-- Mobile Device Shell Frame -->
<main class="relative w-full max-w-[412px] h-[884px] md:h-[844px] bg-surface flex flex-col justify-between items-center px-margin py-8 md:rounded-[44px] md:shadow-[0_24px_60px_-12px_rgba(15,23,42,0.12)] md:border md:border-outline-variant/30 overflow-hidden">

<div class="absolute -top-32 -right-32 w-80 h-80 rounded-full bg-primary-container/20 blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-36 -left-28 w-96 h-96 rounded-full bg-secondary-fixed/30 blur-3xl pointer-events-none"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full bg-primary-fixed/20 blur-2xl pointer-events-none animate-aura"></div>

<div class="flex items-center space-x-1.5">
<span class="text-label-md font-label-md text-on-surface font-semibold tracking-tight">9:41</span>
</div>
<div class="flex items-center space-x-2 text-on-surface">
<span class="material-symbols-outlined text-[16px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px]">wifi</span>
<span class="material-symbols-outlined text-[20px]">battery_full</span>
</div>
</header>

<section class="flex flex-col items-center justify-center z-10 my-auto text-center px-4 w-full">
<!-- Animated Architectural Logo Icon Container -->
<div class="relative flex items-center justify-center mb-7 animate-logo-pulse">

<div class="absolute inset-0 rounded-3xl bg-primary-container/30 blur-xl scale-110"></div>
<!-- Outer Sleek Brand Card -->
<div class="relative w-24 h-24 rounded-3xl bg-surface-container-lowest border border-outline-variant/40 shadow-[0_12px_32px_-4px_rgba(15,23,42,0.08),0_4px_12px_-2px_rgba(56,189,248,0.15)] flex items-center justify-center">

<div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-secondary to-primary-container flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-surface-container-lowest text-4xl" data-icon="domain" data-weight="fill" style="font-variation-settings: 'FILL' 1;">domain</span>
</div>
<!-- Decorative Floating Corner Beacon -->
<div class="absolute -top-1.5 -right-1.5 w-6 h-6 rounded-full bg-surface-container-lowest border border-outline-variant/30 flex items-center justify-center shadow-sm">

</div>

<span class="material-symbols-outlined text-primary text-[15px]" data-icon="school">school</span>
<span class="text-label-sm font-label-sm text-on-surface-variant tracking-wider uppercase font-semibold">Smart Student Portal</span>
